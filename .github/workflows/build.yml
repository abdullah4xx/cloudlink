name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Python tests
        working-directory: linux_app
        run: |
          for t in tests/test_*.py; do echo "== $t"; python3 "$t"; done
      - name: Build .deb
        run: ./packaging/build_deb.sh 2.0.0
      - uses: actions/upload-artifact@v4
        with: { name: cloudlink-deb, path: dist/*.deb }

 android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # قم بإلغاء/حذف خطوة setup-android كلياً

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy test vectors
        run: cp protocol/test_vectors.json android/app/src/test/resources/test_vectors.json

      - name: Run Unit Tests
        run: cd android && ./gradlew test

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
