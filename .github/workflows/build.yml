name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Python tests
        working-directory: linux_app
        run: |
          for t in tests/test_*.py; do echo "== $t"; python3 "$t"; done
      - name: Build .deb
        run: ./packaging/build_deb.sh 2.0.0
      - uses: actions/upload-artifact@v4
        with: { name: cloudlink-deb, path: dist/*.deb }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      # keep the Kotlin test vectors identical to the protocol's source of truth
      - run: cp protocol/test_vectors.json android/app/src/test/resources/test_vectors.json
      - name: Unit tests (crypto vectors + two-engine loopback)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: cloudlink-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
